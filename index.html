<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Kid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛡️ SAFE KID</h1>

<p><b>Smart Child Safety Bracelet</b></p>
<p>Protecting Children, One Scan Away ❤️</p>

<a href="register.html">
    <button>Register Child</button>
</a>

<div id="qrSection" style="display:none;">
    <h2>Your Bracelet QR</h2>

    <img id="qrImage" width="250" height="250">

    <p><b>📱 Scan the QR code for emergency information.</b></p>

    <p id="braceletText"></p>
</div>

<script>
const child = JSON.parse(localStorage.getItem("childData"));

if (child && child.id) {

    document.getElementById("qrSection").style.display = "block";

    const childURL =
        "https://jodysayed006-cpu.github.io/Safe_Kid_judy/child.html?id=" +
        encodeURIComponent(child.id);

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
        encodeURIComponent(childURL);

    const qrImage = document.getElementById("qrImage");

    qrImage.src = qrURL;
    qrImage.style.display = "block";

    document.getElementById("braceletText").innerText =
        "Bracelet ID: " + child.id;
}
</script>
</body>
</html>
