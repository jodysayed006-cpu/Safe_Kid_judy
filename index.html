<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Kid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛡️ SAFE KID</h1>

<p><b>Smart Child Safety Bracelet</b></p>
<p>Protecting Children, One Scan Away ❤️</p>

<a href="register.html">
    <button>Register Child</button>
</a>

<div id="qrSection">
    <h2>Your Bracelet QR</h2>

    <img
        id="qrImage"
        src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=SK1001"
        width="250"
        height="250"
        alt="Safe Kid QR Code">

    <p>📱 Scan this QR code for emergency information.</p>

    <p id="braceletText"></p>
</div>

<script>
const child = JSON.parse(localStorage.getItem("childData"));

if (child && child.id) {
    document.getElementById("braceletText").innerText =
        "Bracelet ID: " + child.id;
}
</script>

</body>
</html>
