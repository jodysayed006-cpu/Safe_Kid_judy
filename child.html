<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Kid - Child Information</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛡️ SAFE KID</h1>

<h2>Emergency Child Information</h2>

<div id="info">
    Loading...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if (id) {

    document.getElementById("info").innerHTML =
        "<h3>Bracelet ID: " + id + "</h3>" +
        "<p>✅ Safe Kid bracelet detected.</p>" +
        "<p>Please contact the child's parent.</p>";

} else {

    document.getElementById("info").innerHTML =
        "<p>❌ No Bracelet ID found.</p>";
}
</script>

</body>
</html>
