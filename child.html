<!DOCTYPE html>
<html>
<head>
    <title>Child Information - Safe Kid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚨 Emergency Child Information</h1>

<div id="childData"></div>
<p><b>If you found this child, please contact the parent immediately.</b></p>
<a id="callButton">
    <button>Call Parent</button>
</a>
    <script src="script.js"></script>
    <script>
const AIRTABLE_TOKEN = "patjKHqsCHcNCVtEZ.d7f3763c6751d0d348c8067237de8b7e8557ecdd81b2f9b52d90335d12e32880";
const BASE_ID = "appXixEqsUvtkDjJN";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const childID = params.get("id");

fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}?filterByFormula={childID}="${childID}"`, {
  headers: {
    Authorization: "Bearer " + AIRTABLE_TOKEN
  }
})
.then(res => res.json())
.then(data => {
  if (data.records.length > 0) {
    let child = data.records[0].fields;

    document.getElementById("childData").innerHTML =
      "ID: " + child.childID + "<br>" +
      "Name: " + child.childName + "<br>" +
      "Age: " + child.age + "<br>" +
      "Blood Type: " + child.bloodType + "<br>" +
      "Allergies: " + child.allergies + "<br>" +
      "Medical Condition: " + child.medicalCondition + "<br>" +
      "Parent Name: " + child.parentName + "<br>" +
      "Phone: " + child.parentPhone + "<br>" +
      "Address: " + child.address;

    document.getElementById("callButton").href = "tel:" + child.parentPhone;
  } else {
    document.getElementById("childData").innerHTML = "Child not found.";
  }
});
</script>
</body>
</html>
