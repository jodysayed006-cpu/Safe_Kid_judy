<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Child - Safe Kid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛡️ Register Child</h1>
<p>Enter the child's emergency information</p>

<div class="form">

<input id="braceletID" type="text" placeholder="Bracelet ID">
<input id="name" type="text" placeholder="Child Name">
<input id="age" type="text" placeholder="Age">
<input id="blood" type="text" placeholder="Blood Type">
<input id="allergy" type="text" placeholder="Allergies">
<input id="medical" type="text" placeholder="Medical Condition">
<input id="parent" type="text" placeholder="Parent Name">
<input id="phone" type="tel" placeholder="Parent Phone">
<input id="address" type="text" placeholder="Home Address">

<button onclick="saveData()">💾 Save Child</button>

</div>

<script src="script.js"></script>

</body>
</html>
